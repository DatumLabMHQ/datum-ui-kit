name: check
# Three jobs on every push. The first proves the gallery still typechecks, lints, builds and passes the
# layout smoke test. The other two scaffold a project with bin/datum-ui, one per shell, with an
# apostrophe in the title and the description (a real scaffold once broke on one), then run
# `npm run check` and the smoke test against the result. So neither the generator nor either shell can
# rot while the template moves.
on:
  push:
    branches: [main]
  pull_request:
jobs:
  template:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    defaults:
      run:
        working-directory: templates/app
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: "22", cache: npm, cache-dependency-path: templates/app/package-lock.json }
      - run: npm ci
      - run: npm run typecheck
      - run: npm run lint
      - run: npm run build
      - run: npx playwright install --with-deps chromium
      - run: npx playwright test
        env:
          CI: "true"
          BASE_URL: http://localhost:3000
      - uses: actions/upload-artifact@v4
        if: failure()
        with: { name: playwright-traces, path: templates/app/test-results/, retention-days: 7 }
  scaffold:
    name: scaffold (${{ matrix.kind }})
    runs-on: ubuntu-latest
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        kind: [app, site]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: "22" }
      - name: Scaffold a ${{ matrix.kind }} with an apostrophe in its title and its description
        run: >
          DATUM_ROOT=/tmp/scaffold python3 bin/datum-ui new ci-${{ matrix.kind }} --kind ${{ matrix.kind }}
          --title "Datum's CI ${{ matrix.kind }}"
          --description "How the kit's ${{ matrix.kind }} shell fares when it's scaffolded in CI: an apostrophe in every string, and the checks run against the result."
      - name: The generated project installs
        working-directory: /tmp/scaffold/ci-${{ matrix.kind }}
        run: npm install --no-audit --no-fund
      - name: The generated project passes npm run check
        working-directory: /tmp/scaffold/ci-${{ matrix.kind }}
        run: npm run check
      - name: The generated project passes the smoke test
        working-directory: /tmp/scaffold/ci-${{ matrix.kind }}
        run: npx playwright install --with-deps chromium && npx playwright test
        env:
          CI: "true"
          BASE_URL: http://localhost:3000
      - uses: actions/upload-artifact@v4
        if: failure()
        with: { name: playwright-traces-ci-${{ matrix.kind }}, path: /tmp/scaffold/ci-${{ matrix.kind }}/test-results/, retention-days: 7 }
