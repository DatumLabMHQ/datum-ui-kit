name: check
# Two jobs on every push. The first proves the gallery still typechecks, lints, builds and passes the
# layout smoke test. The second scaffolds a project with bin/datum-ui and builds that, so the
# generator cannot rot while the template moves.
on:
  push:
    branches: [main]
  pull_request:
jobs:
  template:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    defaults:
      run:
        working-directory: templates/app
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: "22", cache: npm, cache-dependency-path: templates/app/package-lock.json }
      - run: npm ci
      - run: npm run typecheck
      - run: npm run lint
      - run: npm run build
      - run: npx playwright install --with-deps chromium
      - run: npx playwright test
        env:
          CI: "true"
          BASE_URL: http://localhost:3000
      - uses: actions/upload-artifact@v4
        if: failure()
        with: { name: playwright-traces, path: templates/app/test-results/, retention-days: 7 }
  scaffolder:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: "22" }
      - name: Scaffold an app and a site
        run: |
          DATUM_ROOT=/tmp/scaffold python3 bin/datum-ui new ci-app --title "CI App"
          DATUM_ROOT=/tmp/scaffold python3 bin/datum-ui new ci-site --kind site --title "CI Site"
      - name: The generated app builds
        working-directory: /tmp/scaffold/ci-app
        run: npm install --no-audit --no-fund && npm run typecheck && npm run lint && npm run build
